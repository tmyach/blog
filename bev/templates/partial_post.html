<article>
    <header>
        <h2><a href="{{ post.url }}">{{ post.title }}</a></h2>
        <small>{{ post.date }}
            {% if post.category %}
            | <a href="{{ pccaturl(post.category) }}">{{ post.category }}</a>
            {% endif %}
        </small>
    </header>
    <section>
        {{ post.content|safe }}
    </section>
    {% if post.tags %}
    <div class="mb-tags">
        {% for t in post.tags %}
        <a class="mb-tag" href="{{ pctagurl(t) }}">{{ t }}</a>
        {% endfor %}
    </div>
    {% endif %}
</article>
